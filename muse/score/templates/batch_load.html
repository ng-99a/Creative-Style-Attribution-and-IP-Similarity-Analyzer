<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzing Artworks - MUSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background: #f8f9fa;
            color: #202124;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #dadce0;
            padding: 0 40px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #202124;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
        }

        .navbar-brand span {
            color: #008abf;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            background: #e8f0fe;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .nav-links { display: flex; gap: 16px; }

        .nav-link {
            text-decoration: none;
            color: #5f6368;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .nav-link.active {
            color: #008abf;
            background: #e8f0fe;
            font-weight: 600;
        }

        .main-container {
            max-width: 500px;
            margin: 60px auto;
            padding: 0 20px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e8f0fe;
            border-top: 4px solid #008abf;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .title { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: #202124; margin-bottom: 8px; }
        .desc { font-size: 0.9rem; color: #5f6368; line-height: 1.45; }
        .badge { display: inline-block; margin-top: 20px; background: #e8f0fe; color: #1a73e8; padding: 4px 14px; border-radius: 16px; font-size: 0.82rem; font-weight: 500; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">
        MUSE <span>ART</span>
    </a>
    <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/score/explore/" class="nav-link">Explore Art</a>
        <a href="/score/batch/" class="nav-link active">Analyze Art</a>
    </div>

</nav>

<div class="main-container">
    <div class="card">
        <div class="spinner"></div>
        <div class="title">Analyzing Artworks</div>
        <div class="desc">Comparing artistic styles across your images to discover matching clusters...</div>
        <div class="badge">Status: {{ batch.status }}</div>
    </div>
</div>

</body>
</html>

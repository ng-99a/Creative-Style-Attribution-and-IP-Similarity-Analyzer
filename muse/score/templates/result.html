<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSE - 2-Image Comparison Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f8f9fa; color: #202124; min-height: 100vh; display: flex; flex-direction: column; }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #dadce0;
            padding: 0 30px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #202124;
            text-decoration: none;
        }
        .navbar-brand span { color: #008abf; }
        .nav-links { display: flex; gap: 20px; }
        .nav-link {
            text-decoration: none;
            color: #5f6368;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 18px 0;
            border-bottom: 3px solid transparent;
        }
        .nav-link.active { color: #202124; border-bottom-color: #008abf; }

        .main-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 1px 3px rgba(60,64,67,0.08);
        }

        .score-banner {
            background: #e8f0fe;
            border: 1px solid #c2e7ff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .score-val {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a73e8;
        }

        .score-lbl {
            font-size: 0.9rem;
            color: #5f6368;
            margin-top: 4px;
        }

        .images-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 35px;
        }

        .img-card {
            text-align: center;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 10px;
            padding: 16px;
        }

        .img-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .img-card .lbl {
            font-weight: 600;
            color: #202124;
            font-size: 0.95rem;
        }

        .btn-primary {
            display: inline-block;
            background: #008abf;
            color: white;
            padding: 12px 28px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .btn-primary:hover { background: #0075a3; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand"><span>MUSE</span> | Art Similarity</a>
    <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/score/" class="nav-link active">2-Image Comparison</a>
        <a href="/score/batch/" class="nav-link">Batch Analysis</a>
    </div>
</nav>

<div class="main-container">
    <div class="card">
        <div class="score-banner">
            <div class="score-val">{{ similarity }}%</div>
            <div class="score-lbl">Artistic Style Similarity Score</div>
        </div>

        <div class="images-grid">
            <div class="img-card">
                <img src="{{ task.image1.url }}" alt="Target Image">
                <div class="lbl">Target Image</div>
            </div>
            <div class="img-card">
                <img src="{{ task.image2.url }}" alt="Reference Image">
                <div class="lbl">Reference Image</div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="{% url 'score' %}" class="btn-primary">Compare Another Pair</a>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSE - 2-Image Style Comparison</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f8f9fa; color: #202124; min-height: 100vh; display: flex; flex-direction: column; }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #dadce0;
            padding: 0 30px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #202124;
            text-decoration: none;
        }
        .navbar-brand span { color: #008abf; }
        .nav-links { display: flex; gap: 20px; }
        .nav-link {
            text-decoration: none;
            color: #5f6368;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 18px 0;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .nav-link:hover, .nav-link.active {
            color: #202124;
            border-bottom-color: #008abf;
        }

        .main-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 1px 3px rgba(60,64,67,0.08);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #202124;
        }
        .card-desc {
            font-size: 0.95rem;
            color: #5f6368;
            margin-bottom: 25px;
        }

        .error-box {
            background: #fce8e6;
            border: 1px solid #fad2cf;
            color: #c5221f;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #dadce0;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px 20px;
            text-align: center;
            transition: border-color 0.2s ease;
        }
        .upload-box:hover {
            border-color: #008abf;
        }
        .upload-box h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #202124;
        }
        .file-input {
            width: 100%;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: #008abf;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-primary:hover {
            background: #0075a3;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand"><span>MUSE</span> | Art Similarity</a>
    <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/score/" class="nav-link active">2-Image Comparison</a>
        <a href="/score/batch/" class="nav-link">Batch Analysis</a>
    </div>
</nav>

<div class="main-container">
    <div class="card">
        <h1 class="card-title">2-Image Style Comparison</h1>
        <p class="card-desc">Upload two artwork images to extract feature vectors and calculate their artistic style similarity percentage.</p>

        {% if error %}
        <div class="error-box">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}

        <form action="{% url 'compare_image' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="upload-grid">
                <div class="upload-box">
                    <h3>Target Image</h3>
                    <input type="file" name="image1" class="file-input" required>
                </div>
                <div class="upload-box">
                    <h3>Reference Image</h3>
                    <input type="file" name="image2" class="file-input" required>
                </div>
            </div>

            <div style="text-align: center;">
                <button type="submit" class="btn-primary">Compare Artistic Styles</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
